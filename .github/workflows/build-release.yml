name: Build and Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/sync-upstream.yml'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 2026-10-19 修：默认 GITHUB_TOKEN 只读 → 建 Release 报
    # "Resource not accessible by integration"（main 上这个 workflow 一直红）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get upstream version
        id: ver
        run: |
          # Get latest upstream tag, fallback to date
          VER=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          DATE=$(date +%Y%m%d)
          echo "tag=${VER}-mirror-${DATE}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      
      - name: Build
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o dist/opencode2api-windows-amd64.exe ./cmd/opencode2api
          GOOS=linux GOARCH=amd64 go build -o dist/opencode2api-linux-amd64 ./cmd/opencode2api
          GOOS=darwin GOARCH=arm64 go build -o dist/opencode2api-darwin-arm64 ./cmd/opencode2api
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Mirror ${{ steps.ver.outputs.version }} (${{ steps.ver.outputs.tag }})"
          body: |
            Auto-built mirror of jasonxu114514/opencode2api.
            Upstream version: ${{ steps.ver.outputs.version }}
            Synced: ${{ github.event.head_commit.timestamp }}
          files: dist/*
          draft: false
          prerelease: false
