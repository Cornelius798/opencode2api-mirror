name: Sync Upstream

on:
  schedule:
    - cron: '0 18 * * *'  # Daily at 18:00 UTC (02:00 Beijing)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # 2026-10-19 修：默认 GITHUB_TOKEN 只读 → git push 报
    # "The requested URL returned error: 403"（自 10-16 起每天同步都失败）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/jasonxu114514/opencode2api.git || true
          git fetch upstream main
      
      - name: Merge upstream and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # --no-commit：先不生成合并提交，好把 .github/workflows 还原成本仓库版本。
          # 原因：①上游的 workflow 会覆盖我们对 CI 的补丁（retention-days / permissions）；
          #      ②GITHUB_TOKEN 没有改 workflow 文件的权限，改了也推不上去
          #        （refusing to allow a GitHub App to create or update workflow）。
          if git merge upstream/main --no-edit --no-ff --no-commit; then
            git checkout HEAD -- .github/workflows
            git commit -m "chore(sync): merge upstream/main $(date -u +%Y-%m-%d)"
          else
            echo "Merge conflict, manual intervention needed"
            git merge --abort || true
            exit 0
          fi
          git push origin main
