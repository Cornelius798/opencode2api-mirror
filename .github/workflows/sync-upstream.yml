name: Sync Upstream

on:
  schedule:
    - cron: '0 18 * * *'  # Daily at 18:00 UTC (02:00 Beijing)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # 2026-10-19 修：默认 GITHUB_TOKEN 只读 → git push 报
    # "The requested URL returned error: 403"（自 10-16 起每天同步都失败）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/jasonxu114514/opencode2api.git || true
          git fetch upstream main
      
      - name: Merge upstream and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit || echo "Merge conflict, manual intervention needed"
          # Push directly: after a successful merge the worktree is clean,
          # so `git status --porcelain` is always empty and would skip the push.
          git push origin main
